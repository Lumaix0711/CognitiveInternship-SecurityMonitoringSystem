services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: security_monitor
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 中设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./mysql8-security-monitor.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" security_monitor -e \"SELECT 1\""]
      interval: 5s
      timeout: 5s
      retries: 24

  app:
    build: ../backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      TZ: Asia/Shanghai
      AI_WATCH_DIR: /opt/smart-security/model/ai-watch
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 中设置 MYSQL_ROOT_PASSWORD}
      APP_AUTH_USER: ${APP_AUTH_USER:?必须在 .env 中设置 APP_AUTH_USER}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?必须在 .env 中设置 APP_AUTH_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../model/ai-watch:/opt/smart-security/model/ai-watch

volumes:
  mysql_data:
